name: Build, push and deploy

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # tag :latest on every push to main
            type=raw,value=latest,enable={{is_default_branch}}
            # tag :vX.Y.Z on version tags
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            # always tag with short git SHA
            type=sha,prefix=sha-

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to k3s
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve image tag
        id: tag
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            # v1.2.3 → 1.2.3  (strips the leading v to match semver tag produced above)
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Copy Helm chart to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: fpvautotuner.com
          username: svetlio
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "helm/"
          target: "~/teltonika-deploy"
          rm: true

      - name: Deploy via Helm
        uses: appleboy/ssh-action@v1
        env:
          IMAGE_TAG: ${{ steps.tag.outputs.value }}
          MONGO_ROOT_PASS: ${{ secrets.MONGO_ROOT_PASSWORD }}
          MONGO_PASS: ${{ secrets.MONGO_PASSWORD }}
          MYSQL_USER: ${{ secrets.MYSQL_USER }}
          MYSQL_PASS: ${{ secrets.MYSQL_PASS }}
        with:
          host: fpvautotuner.com
          username: svetlio
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: IMAGE_TAG,MONGO_ROOT_PASS,MONGO_PASS,MYSQL_USER,MYSQL_PASS
          script: |
            set -euo pipefail
            helm dependency update ~/teltonika-deploy/helm/teltonika
            helm upgrade --install teltonika ~/teltonika-deploy/helm/teltonika \
              --namespace teltonika \
              --create-namespace \
              --set server.image.tag="$IMAGE_TAG" \
              --set mongodb.auth.rootPassword="$MONGO_ROOT_PASS" \
              --set mongodb.auth.password="$MONGO_PASS" \
              --set credentials.mysqlUser="$MYSQL_USER" \
              --set credentials.mysqlPass="$MYSQL_PASS" \
              --wait \
              --timeout 5m
