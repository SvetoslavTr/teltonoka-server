apiVersion: v2
name: teltonika
description: >
  Teltonika GPS integration — TCP ingest server + Django beacon sync worker.
  The server receives Codec 8/8E frames from Teltonika FMB devices, stores them
  in MongoDB, and a sync worker propagates beacon sightings to Django MySQL.
type: application
version: 0.1.0
appVersion: "1.0.0"
keywords:
  - teltonika
  - gps
  - iot
  - beacon
maintainers:
  - name: unitrade

dependencies:
  - name: mongodb
    version: "^16.0.0"
    repository: https://charts.bitnami.com/bitnami
    condition: mongodb.enabled
