apiVersion: v1
kind: Service
metadata:
  name: {{ include "teltonika.fullname" . }}-server
  labels: {{- include "teltonika.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector: {{- include "teltonika.server.selectorLabels" . | nindent 4 }}
  ports:
    - {name: teltonika, port: {{ .Values.server.tcpPort }}, targetPort: teltonika, protocol: TCP}
