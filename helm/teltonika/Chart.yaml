apiVersion: v2
name: teltonika
description: >
  Teltonika TCP ingest server (gps.py). Receives Codec 8/8E frames from Teltonika
  FMB devices over raw TCP and stores the decoded records in MongoDB. The Django
  sync worker (unitrade_cluster repo) moves them into MySQL.
type: application
version: 0.2.0
appVersion: "1.0.0"
keywords: [teltonika, gps, iot]
maintainers:
  - name: unitrade
