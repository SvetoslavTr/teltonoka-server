name: Build, push and deploy

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # tag :latest on every push to main
            type=raw,value=latest,enable={{is_default_branch}}
            # tag :vX.Y.Z on version tags
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            # always tag with short git SHA
            type=sha,prefix=sha-

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to K3s (namespace unitradecluster)
    needs: build-and-push
    # Self-hosted runner scale set inside the unitrade K3s cluster (ARC). Its
    # ServiceAccount may only manage this release's objects in unitradecluster.
    runs-on: arc-teltonika
    if: github.event_name == 'push'
    env:
      # Helm stores release state in ConfigMaps, so the deployer needs no access to Secrets
      HELM_DRIVER: configmap

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: azure/setup-helm@v5
        with:
          version: v4.3.0

      - name: Resolve image tag
        id: tag
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            # v1.2.3 -> 1.2.3  (matches the semver tag produced above)
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy via Helm
        run: |
          helm upgrade --install teltonika helm/teltonika \
            --namespace unitradecluster \
            --set server.image.tag="${{ steps.tag.outputs.value }}" \
            --rollback-on-failure --wait --timeout 5m
