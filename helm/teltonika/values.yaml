# Deployed by CI into the unitrade K3s cluster (namespace unitradecluster):
#   helm upgrade --install teltonika helm/teltonika -n unitradecluster --set server.image.tag=sha-xxxxxxx
server:
  image:
    repository: ghcr.io/svetoslavtr/teltonoka-server
    tag: ""                      # set by CI (sha-<short sha>)
    pullPolicy: IfNotPresent
  imagePullSecrets: [ghcr-pull]
  tcpPort: 9999
  beaconRefreshSecs: 300
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {memory: 256Mi}

# Devices reach the server through a Traefik TCP entry point (raw TCP, not HTTP).
# The entry point is defined in the cluster's Traefik config (hostPort 9999).
traefik:
  entryPoint: teltonika

# Existing Secret with MONGO_USER, MONGO_PASS, MYSQL_USER, MYSQL_PASS
existingSecret: teltonika-server-env

mongodb:
  host: mongodb.databases.svc.cluster.local
  port: 27017
  database: trackersData

mysql:
  host: mysql.databases.svc.cluster.local
  port: 3306
  database: unitradecluster
